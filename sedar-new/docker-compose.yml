services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  odoo:
    image: odoo:19.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./custom-addons:/mnt/extra-addons
      - ./data/odoo:/var/lib/odoo
    command:
      - bash
      - -c
      - |
        SEDAR_MODULES="sedar_ais_demo,sedar_applicant_intake,sedar_applicant_portal,sedar_careers,sedar_crew_compliance,sedar_crew_scheduling,sedar_crewing_availability,sedar_demo_suite,sedar_document_control,sedar_erp_demo,sedar_executive_dashboard,sedar_hsse,sedar_manpower_planning,sedar_manpower_planning_demo,sedar_marketing,sedar_marine_dispatch,sedar_marine_dispatch_demo,sedar_marine_finance,sedar_marine_inventory,sedar_marine_maintenance,sedar_marine_operations,sedar_portal_theme,sedar_purchase_request,sedar_recruitment_crewing,sedar_recruitment_demo,sedar_recruitment_operations,sedar_service_order_demo,sedar_theme,sedar_ui_cards"
        odoo -c /etc/odoo/odoo.conf -d sedar_demo \
          -i "$$SEDAR_MODULES" \
          -u "$$SEDAR_MODULES" \
          --without-demo=true --stop-after-init --no-http
        exec odoo -c /etc/odoo/odoo.conf -d sedar_demo
