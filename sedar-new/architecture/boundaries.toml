  "sedar_manpower_planning",
  "sedar_crew_compliance",
  "sedar_crewing_availability",
  "sedar_crew_scheduling",
  "sedar_careers",
  "sedar_applicant_intake",
  "sedar_applicant_portal",
  "sedar_recruitment_operations",
  "sedar_recruitment_crewing",
]
supply = ["sedar_purchase_request"]
customer = ["sedar_marketing"]
platform = [
  "sedar_document_control",
  "sedar_executive_dashboard",
  "sedar_theme",
  "sedar_portal_theme",
  "sedar_ui_cards",
]
demo = [
