<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEDAR Ship Log</title>
<style>
  :root {
    --navy-880:#092447; --navy-950:#06182f; --blue:#4aa8e8; --blue-soft:#a9dbff;
    --bg:#f3f6fa; --card:#fff; --ink:#0f1f36; --muted:#5d7088; --line:#d8e1ec;
    --bad:#c0352b; --warn:#b26a00; --ok:#1a7f4b;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 Inter, "Segoe UI", Roboto, Arial, sans-serif; }
  header { background:linear-gradient(180deg, var(--navy-880), var(--navy-950)); color:#f5f8fc; padding:12px 20px; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:14px; }
  .brand img { height:44px; width:auto; display:block; }
  .brand h1 { font-size:17px; font-weight:600; margin:0; letter-spacing:.02em; }
  .brand small { display:block; color:#8fa3ba; font-weight:400; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
  header .pill { background:rgba(215,230,244,.14); border:1px solid rgba(215,230,244,.22); border-radius:999px; padding:3px 12px; font-size:12.5px; color:#d8e6f4; }
  header a { color:var(--blue-soft); font-size:14px; }
  main { max-width:980px; margin:0 auto; padding:20px 16px 40px; display:grid; gap:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; box-shadow:0 1px 2px rgba(9,36,71,.05); }
  h2 { font-size:16px; font-weight:600; margin:0 0 14px; color:var(--navy-880); }
  h3 { margin:0 0 10px; font-size:14.5px; font-weight:600; }
  label { display:grid; gap:4px; font-size:12.5px; color:var(--muted); font-weight:500; }
  input, select, textarea { width:100%; min-width:0; font:inherit; color:var(--ink); background:#fff; padding:9px 10px; border:1px solid var(--line); border-radius:6px; min-height:42px; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--blue); outline-offset:0; border-color:var(--blue); }
  button { font:inherit; font-weight:600; padding:9px 18px; border:1px solid var(--navy-880); border-radius:6px; background:var(--navy-880); color:#fff; cursor:pointer; min-height:42px; }
  button:hover { background:#0d3263; }
  button.secondary { background:transparent; color:var(--navy-880); border-color:var(--line); }
  header button.secondary { color:#f5f8fc; border-color:rgba(215,230,244,.4); min-height:34px; padding:4px 14px; }
  header button.secondary:hover { background:rgba(215,230,244,.12); }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:end; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; }
  .engine { border:1px solid var(--line); border-left:3px solid var(--blue); border-radius:8px; padding:14px; margin-bottom:14px; background:#fbfdff; }
  .engine h3 .muted { font-weight:400; }
  .badge { display:inline-block; border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; background:#e8eef6; color:var(--navy-880); text-transform:capitalize; }
  .badge.due, .badge.overdue { background:#fde7e5; color:var(--bad); }
  .badge.approaching { background:#fdf0d9; color:var(--warn); }
  .due, .overdue { color:var(--bad); } .approaching { color:var(--warn); }
  .task { border-top:1px solid var(--line); padding:14px 0; display:grid; gap:8px; }
  .task:first-of-type { border-top:0; padding-top:0; }
  .muted { color:var(--muted); font-size:13px; }
  #banner { background:#fdf0d9; color:#6b4300; border-bottom:1px solid #f0d49c; padding:10px 20px; display:none; }
  #banner a { color:var(--navy-880); font-weight:600; }
</style>
</head>
<body>
<div id="banner"></div>
<header>
  <div class="brand">
    <img src="sedar-logo.png" alt="SEDAR Tug Services Corp.">
    <h1><small>Technical Maintenance</small>Ship Log</h1>
  </div>
  <div class="row" style="align-items:center">
    <span class="pill" id="net">Checking…</span>
    <span class="pill" id="synced">Not synced yet</span>
    <span class="pill" id="pending">0 waiting</span>
    <button class="secondary" id="sync-now">Sync now</button>
    <a href="/odoo">Open Odoo</a>
  </div>
</header>
<main>
  <section>
    <label>Tugboat <select id="tug"></select></label>
  </section>

  <section>
    <h2>Daily Engine Report</h2>
    <div class="row">
      <label>Report date <input type="date" id="report-date"></label>
    </div>
    <div id="engines" style="margin-top:12px"></div>
    <h3>Remaining on board</h3>
    <div class="grid">
      <label>D.O. (L) <input type="number" inputmode="decimal" step="any" id="rob_diesel"></label>
      <label>L.O. 40 (L) <input type="number" inputmode="decimal" step="any" id="rob_lube_40"></label>
      <label>L.O. 15W-40 (L) <input type="number" inputmode="decimal" step="any" id="rob_lube_15w40"></label>
      <label>Hydraulic oil (L) <input type="number" inputmode="decimal" step="any" id="rob_hydraulic"></label>
      <label>Fresh water <input type="number" inputmode="decimal" step="any" id="rob_fresh_water"></label>
    </div>
    <label style="margin-top:10px">Remarks <textarea id="report-remarks" rows="2"></textarea></label>
    <p class="muted">Saving posts the hours to each engine and cannot be undone. Without a connection it waits here and is posted once you sync.</p>
    <button id="save-report">Save report</button>
  </section>

  <section>
    <h2>Planned maintenance</h2>
    <div id="tasks"></div>
  </section>

  <section>
    <h2>Waiting to sync</h2>
    <div id="queue"></div>
    <p class="muted" id="done-log"></p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
