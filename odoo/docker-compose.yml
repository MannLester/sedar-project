services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - sedar-odoo-db:/var/lib/postgresql/data

  odoo:
    image: odoo:17.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - sedar-odoo-web:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf
      - ./custom_addons:/mnt/extra-addons
      - ../addons/sedar_base:/mnt/extra-addons/sedar_base
      - ../addons/sedar_crewing:/mnt/extra-addons/sedar_crewing
      - ../addons/sedar_dashboard:/mnt/extra-addons/sedar_dashboard
      - ../addons/sedar_doccontrol:/mnt/extra-addons/sedar_doccontrol
      - ../addons/sedar_employee_document_control:/mnt/extra-addons/sedar_employee_document_control
      - ../addons/sedar_employee_identity:/mnt/extra-addons/sedar_employee_identity
      - ../addons/sedar_employee_records:/mnt/extra-addons/sedar_employee_records
      - ../addons/sedar_hsse:/mnt/extra-addons/sedar_hsse
      - ../addons/sedar_maintenance_link:/mnt/extra-addons/sedar_maintenance_link
      - ../addons/sedar_recruitment_link:/mnt/extra-addons/sedar_recruitment_link
      - ../addons/sedar_applicant_portal:/mnt/extra-addons/sedar_applicant_portal
      - ../addons/sedar_applicant_dashboard:/mnt/extra-addons/sedar_applicant_dashboard
      - ../addons/sedar_job_applicants_list:/mnt/extra-addons/sedar_job_applicants_list
      - ../addons/sedar_owner_preview:/mnt/extra-addons/sedar_owner_preview
      - ../addons/sedar_theme:/mnt/extra-addons/sedar_theme
      - ../addons/sedar_ui_cards:/mnt/extra-addons/sedar_ui_cards
      - ../addons/sedar_tug_ops:/mnt/extra-addons/sedar_tug_ops
      - ../addons/sedar_marketing:/mnt/extra-addons/sedar_marketing
      - ../addons/sedar_procurement:/mnt/extra-addons/sedar_procurement
      - ../addons/sedar_operations_integration:/mnt/extra-addons/sedar_operations_integration
      - ../addons/sedar_finance_operations:/mnt/extra-addons/sedar_finance_operations
      - ./community/account-financial-reporting/account_financial_report:/mnt/extra-addons/account_financial_report
      - ./community/server-ux/date_range:/mnt/extra-addons/date_range
      - ./community/reporting-engine/report_xlsx:/mnt/extra-addons/report_xlsx
      - ./community/reporting-engine/report_xlsx_helper:/mnt/extra-addons/report_xlsx_helper
      - ./community/mis-builder/mis_builder:/mnt/extra-addons/mis_builder
      - ./community/account-financial-reporting/mis_template_financial_report:/mnt/extra-addons/mis_template_financial_report
      - ./community/account-financial-reporting/mis_builder_cash_flow:/mnt/extra-addons/mis_builder_cash_flow
      - ./community/account-financial-reporting/partner_statement:/mnt/extra-addons/partner_statement

volumes:
  sedar-odoo-db:
  sedar-odoo-web:
