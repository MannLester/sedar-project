name: CI

on:
  push:
    branches: [main, sedar-new]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sedar-new

env:
  ODOO_CACHE_KEY: odoo19-v1

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sedar-new/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: make check

  addon-matrix:
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.list.outputs.addons }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          addons=$(find custom-addons -type d -name tests -path '*/sedar_*/tests' | awk -F/ '{print $(NF-1)}' | sort | jq -R . | jq -sc .)
          echo "addons=$addons" >> "$GITHUB_OUTPUT"

  native-tests:
    needs: addon-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.addon-matrix.outputs.addons) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            sedar-new/.local/odoo19
            sedar-new/.local/venv
          key: ${{ env.ODOO_CACHE_KEY }}-${{ hashFiles('sedar-new/scripts/native_odoo.py') }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev libldap2-dev libsasl2-dev
        working-directory: .
      - run: python3 scripts/native_odoo.py setup
      - run: python3 scripts/native_odoo.py test --module ${{ matrix.addon }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.addon }}
          path: sedar-new/.local/logs/

  install-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            sedar-new/.local/odoo19
            sedar-new/.local/venv
          key: ${{ env.ODOO_CACHE_KEY }}-${{ hashFiles('sedar-new/scripts/native_odoo.py') }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev libldap2-dev libsasl2-dev
        working-directory: .
      - run: pip install -r requirements-dev.txt && playwright install --with-deps chromium
      - run: python3 scripts/native_odoo.py setup
      - run: python3 scripts/native_odoo.py install --database sedar_dev --replace
      - run: python3 scripts/smoke.py --start
        env:
          SEDAR_ODOO_SRC: ${{ github.workspace }}/sedar-new/.local/odoo19
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: |
            sedar-new/.local/smoke/
            sedar-new/.local/logs/

  docker-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the shared Docker stack
        run: docker compose up -d
      - name: Wait for the installed database to answer
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS -o /dev/null "http://localhost:8069/web/login?db=sedar_demo"; then exit 0; fi
            sleep 10
          done
          docker compose logs odoo | tail -80
          exit 1
      - name: Fail on installation errors
        run: |
          if docker compose logs odoo | grep -E " (ERROR|CRITICAL) "; then exit 1; fi
      - if: always()
        run: docker compose logs odoo | tail -200
